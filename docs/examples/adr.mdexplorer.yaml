# .mdexplorer.yaml for architecture decision records kept as an OKF wiki.
#
# Decisions use `type: decision` with a `phase` of proposed | accepted | superseded |
# rejected (OKF reserves `status` for its own draft | stable | deprecated), plus
# `deciders`, a `date`, and `supersedes` / `superseded_by` links between records.

frontMatter:
  fields:
    phase:
      as: badge
      colors: { proposed: yellow, accepted: green, superseded: gray, rejected: red }
    deciders:      { as: chips }
    date:          { as: date }
    supersedes:    { as: links }
    superseded_by: { as: links }
    components:    { as: chips }
  byType:
    decision:
      header: [type, phase, trust, generated, date, deciders]
